<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    }

    /* 背景光晕 */
    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0;
      animation: glowPulse 8s ease-in-out infinite;
    }

    .glow-1 {
      background: radial-gradient(circle, rgba(0, 122, 255, 0.4), transparent 70%);
      top: -200px;
      left: -100px;
      animation-delay: 0s;
    }

    .glow-2 {
      background: radial-gradient(circle, rgba(175, 82, 222, 0.35), transparent 70%);
      bottom: -200px;
      right: -100px;
      animation-delay: 3s;
    }

    .glow-3 {
      background: radial-gradient(circle, rgba(255, 55, 95, 0.25), transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 5s;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.3); }
    }

    /* 粒子 */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: float linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* 主文字 */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .text {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      display: flex;
      justify-content: center;
      gap: 0.05em;
    }

    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(60px) scale(0.8);
      filter: blur(10px);
      animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* 光标闪烁 */
    .cursor {
      display: inline-block;
      width: 4px;
      height: 1em;
      background: #fff;
      margin-left: 8px;
      border-radius: 2px;
      animation: blink 1s step-end infinite;
      opacity: 0;
      animation-delay: 2.5s;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 底部副标题 */
    .subtitle {
      margin-top: 24px;
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
      letter-spacing: 0.05em;
      opacity: 0;
      animation: fadeUp 1s ease forwards;
      animation-delay: 2s;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 鼠标跟随光 */
    .mouse-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: left 0.3s ease, top 0.3s ease;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
  <div class="mouse-glow" id="mouseGlow"></div>
  <div class="particles" id="particles"></div>

  <div class="container">
    <div class="text" id="text"></div>
    <div class="subtitle">Welcome to my world</div>
  </div>

  <script>
    // 文字逐个出现
    const text = "Hello, World.";
    const container = document.getElementById('text');

    [...text].forEach((char, i) => {
      const span = document.createElement('span');
      span.className = 'char';
      span.textContent = char === ' ' ? '\u00A0' : char;
      span.style.animationDelay = `${0.5 + i * 0.08}s`;
      container.appendChild(span);
    });

    // 光标
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    container.appendChild(cursor);

    // 粒子
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 8 + 6) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (Math.random() * 3 + 1) + 'px';
      particlesContainer.appendChild(p);
    }

    // 鼠标跟随光
    const mouseGlow = document.getElementById('mouseGlow');
    document.addEventListener('mousemove', (e) => {
      mouseGlow.style.left = e.clientX + 'px';
      mouseGlow.style.top = e.clientY + 'px';
    });
  </script>

</body>
</html>
